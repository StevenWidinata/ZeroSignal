<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zero Signal: a hub of fun browser games with real leaderboards." />
    <title>ZERO SIGNAL · Game Hub</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0e1f" />
    <!-- Link previews: Ping, the site mascot -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zero Signal" />
    <meta property="og:title" content="ZERO SIGNAL · Game Hub" />
    <meta property="og:description" content="Arcade games in your browser, with leaderboards the server checks. Hosted by Ping, the bat." />
    <meta property="og:url" content="https://zerosignal-three.vercel.app/" />
    <meta property="og:image" content="https://zerosignal-three.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ping the pixel bat hanging beside the ZERO SIGNAL wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://zerosignal-three.vercel.app/og-image.png" />
    <script>
      // Apply saved/system theme before paint (no flash). Mirrors store/theme.ts.
      (function () {
        var t;
        try { t = localStorage.getItem("arcade_theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
